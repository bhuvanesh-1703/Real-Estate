<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5C8" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#B08D57" />
      <stop offset="100%" stop-color="#7A5F35" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2820" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#D4AF37" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#bg-grad)" stroke="url(#gold-grad)" stroke-width="2.5" />

  <!-- Luxury Architectural Monogram & Estate Crest -->
  <g filter="url(#glow)">
    <!-- Roof outline & Main Structure -->
    <path d="M 32 15 L 17 26 L 17 49 L 47 49 L 47 26 Z" fill="#0D1410" fill-opacity="0.6" stroke="url(#gold-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Arch & Interior Columns -->
    <path d="M 24 35 L 24 49" stroke="url(#gold-grad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 32 30 L 32 49" stroke="url(#gold-grad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 40 35 L 40 49" stroke="url(#gold-grad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 17 38 L 47 38" stroke="url(#gold-grad)" stroke-width="2" />

    <!-- AI Sparkle Diamond Star at Top Peak -->
    <path d="M 32 7 L 34.5 12.5 L 40 15 L 34.5 17.5 L 32 23 L 29.5 17.5 L 24 15 L 29.5 12.5 Z" fill="url(#gold-grad)" stroke="none" />
  </g>
</svg>